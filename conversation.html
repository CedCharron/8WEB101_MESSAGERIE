<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Messagerie</title>
		<meta
		name="Description"
		content="Blabla">
		<link rel="stylesheet" href="style.css">

	</head>

	<body class="page-message">
		
		<header class="en-tete">
			<h2>Salon de discussion</h2>
			<nav>
				<a href="contact.html">Contact</a>
				<a href="parametre.html">Paramètres</a>
				<a href="#" id="bouton-deconnexion">Déconnexion</a>
			</nav>
		</header>	

		<main class="conteneur-messages">
			<section class="liste-salon">
				<h2>Liste des salons </h2>

				<!-- Zone d'écriture du message -->
				<div class="zoneCreationSalon">
					<input type="text" id="nouveau-salon-input" placeholder="Nouveau salon...">
					<button id="creer-salon">Créer</button>
				</div>

				<ul id="liste-salons"></ul>
			</section>

			<!-- Affichage de la discussion publique -->
    		<section class="discussion-publique">
				<h2 id="titre-discussion">Sélectionnez un salon pour commencer la discussion</h2>
				<div id="discussion">
				</div>
    		
				<!-- Zone d'écriture du message -->
				<div class="zoneEcritureMessage">
					<input type="text" id="message-input" placeholder="Écrire un message...">
					<button id="envoyer-message">Envoyer</button>
				</div>
			</section>

		</main>
<!-- Bibliothèque Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Connexion à Supabase -->
<script src="spclient.js"></script>

<!-- Authentification -->
<script src="auth.js"></script>

<!-- Requêtes à la base de données -->
<script src="data.js"></script>

<!-- Fonctionnement de la page Contacts -->
<script src="conversation.js"></script>

	</body>
</html>
