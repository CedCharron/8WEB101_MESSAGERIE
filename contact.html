<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<title>Contact</title>
		<meta
		name="Description" content="Page de contacts et messagerie privée">
		<link rel="stylesheet" href="style.css">

	</head>

	<body class="page-contact">

		<header class="en-tete">
			<h2>Contacts</h2>
			<nav>
				<a href="conversation.html">Messagerie</a>
				<a href="parametre.html">Paramètres</a>
				<a href="#" id="bouton-deconnexion">Déconnexion</a>
			</nav>
		</header>	

		<main class="conteneur-contacts">

			<!-- Affichage des contacts -->
    		<aside class="liste-utilisateurs"> 
				<h2>Mes contacts</h2>
        			
				<ul id="liste-contacts"></ul>
		 	</aside>

			<!-- Affichage de la discussion privée -->
    		<section class="discussion-privee">
				<h2 id="titre-discussion">Sélectionnez un contact pour commencer la discussion</h2>
				<div id="discussion">
				</div>
    		
				<!-- Zone d'écriture du message -->
				<div class="zoneEcritureMessage">
					<input type="text" id="message-input" placeholder="Écrire un message...">
					<button id="envoyer-message">Envoyer</button>
				</div>
			</section>


		</main>
		
		<!--Scripts-->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="spclient.js"></script>
		<script src="auth.js"></script>
		<script src="data.js"></script>
		<script src="contact.js"></script>
	
	</body>
</html>
